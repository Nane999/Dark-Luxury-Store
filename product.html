<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ապրանքի Մանրամասներ - Dark Luxury Store</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="detail-page">

  <div class="container detail-container-padding">
    <a href="index.html" class="back-btn">
      <i class="fa-solid fa-arrow-left"></i> Վերադառնալ գլխավոր էջ
    </a>
  
    <div id="apranqi-manramasn-tarats"></div>

    <div class="reviews-section" style="margin-top: 40px;">
      <h3 class="reviews-title">Թողնել կարծիք</h3>
      <div id="review-form">
        <div class="form-group">
          <input type="text" id="reviewer-name" placeholder="Ձեր անունը" class="form-input">
        </div>
        <div class="form-group">
          <textarea id="reviewer-text" placeholder="Գրեք ձեր կարծիքը այստեղ..." class="form-input review-textarea"></textarea>
        </div>
        <div class="form-group">
          <select id="reviewer-rating" class="form-input">
            <option value="5">5 Աստղ - Հիանալի</option>
            <option value="4">4 Աստղ - Լավն է</option>
            <option value="3">3 Աստղ - Նորմալ</option>
            <option value="2">2 Աստղ - Վատ չէ</option>
            <option value="1">1 Աստղ - Դուր չեկավ</option>
          </select>
        </div>
        <button id="submit-review-btn" class="neon-btn">Ուղարկել կարծիքը</button>
      </div>

      <h3 class="reviews-title" style="margin-top: 30px;">Օգտատերերի կարծիքները</h3>
      <div id="reviews-container">
        <!-- Այստեղ կհայտնվեն կարծիքները -->
      </div>
    </div>
  </div>


  <script type="module" src="pages/product-app.js"></script>
  <script type="module" src="pages/review-app.js"></script>
</body>
</html>
